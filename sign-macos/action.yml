name: "Sign and notarize macOS executables"
description: "Sign all target directories through the selected PKCS#11 backend and wait for Apple notarization."

inputs:
  preflight-only:
    description: "When true, verify downloads and selected signer-service keys without signing or submitting to Apple. Requires signing-backend: signer-service; also checks notarization when notarization-backend: signer-service."
    default: "false"
  unsigned-directory:
    description: "Directory containing one subdirectory per target, with that target's executables."
    required: true
  signed-directory:
    description: "New output directory for signed targets and their certificates. Must not exist."
    required: true
  entitlements-file:
    description: "Optional plist containing entitlements for the named executable paths."
    default: ""
  entitlements-binaries:
    description: "JSON array of executable paths, relative to each target directory, that receive the entitlements."
    default: "[]"
  azure-client-id:
    description: "Azure identity authorized to sign this release."
    required: true
  azure-tenant-id:
    description: "Azure tenant containing the release identity."
    required: true
  azure-subscription-id:
    description: "Azure subscription containing the signing resources."
    required: true
  storage-account:
    description: "Azure storage account containing the signing components."
    required: true
  storage-container:
    description: "Blob container containing the signing components."
    required: true
  component-rcodesign-blob:
    description: "Blob containing the Linux x86_64 rcodesign executable."
    default: "linux/amd64/rcodesign-e4829d3c3c38cd388566d3ba9dec4735def5bc3a1f3e8dbf29b586771cd7c6d3"
  component-rcodesign-sha256:
    description: "SHA-256 digest of the rcodesign executable."
    default: "e4829d3c3c38cd388566d3ba9dec4735def5bc3a1f3e8dbf29b586771cd7c6d3"
  component-pkcs11-blob:
    description: "Blob containing the Linux x86_64 PKCS#11 library supporting the selected backend."
    required: true
  component-pkcs11-sha256:
    description: "SHA-256 digest of the PKCS#11 library."
    required: true
  signing-backend:
    description: "PKCS#11 signing backend: azure or signer-service."
    default: "azure"
  signer-service-endpoint:
    description: "Signer-service HTTPS origin and GitHub OIDC audience. Required for signer-service."
    default: ""
  signer-service-purpose:
    description: "Authorized signer-service key purpose. Required for signer-service."
    default: ""
  signer-service-key-id:
    description: "Exact key ID matching the pinned certificate. Required for signer-service."
    default: ""
  azure-keyvault-name:
    description: "Azure Key Vault containing the signing certificate and notarization key."
    required: true
  azure-keyvault-key-version:
    description: "Version of the signing certificate to download."
    required: true
  key-name:
    description: "Name of the signing certificate and key."
    required: true
  certificate-sha256:
    description: "Expected SHA-256 fingerprint of the signing certificate's DER encoding."
    required: true
  apple-notarization-akv-key-name:
    description: "Azure Key Vault key for App Store Connect, tagged with apple-key-id and apple-issuer-id."
    required: true
  notarization-backend:
    description: "Apple JWT signing backend: azure or signer-service. Independent of signing-backend."
    default: "azure"
  apple-notarization-akv-key-version:
    description: "Exact Azure key version supplying Apple metadata. Required for signer-service notarization."
    default: ""
  notarization-signer-service-purpose:
    description: "Authorized Astral notarization purpose. Required for signer-service notarization."
    default: ""
  notarization-signer-service-key-id:
    description: "Exact notarization key ID matching the pinned Azure metadata key version."
    default: ""
  notarization-signer-service-spki-sha256:
    description: "Independent SHA-256 of the notarization public key's DER SPKI. Required for signer-service notarization."
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Install uv"
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.13.5"
        checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
        enable-cache: false
        python-version: "3.13"
        activate-environment: true
        venv-path: ${{ runner.temp }}/astral-release-signing-azure-cli
        no-project: true

    - name: "Install Azure CLI"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: uv sync --locked --active --project "$ACTION_PATH/../azure-cli"

    - name: "Log in to Azure with GitHub OIDC"
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
      env:
        AZURE_CORE_OUTPUT: none
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: "Sign macOS executables"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        UNSIGNED_DIRECTORY: ${{ inputs.unsigned-directory }}
        SIGNED_DIRECTORY: ${{ inputs.signed-directory }}
        ENTITLEMENTS_FILE: ${{ inputs.entitlements-file }}
        ENTITLEMENTS_BINARIES: ${{ inputs.entitlements-binaries }}
        STORAGE_ACCOUNT: ${{ inputs.storage-account }}
        STORAGE_CONTAINER: ${{ inputs.storage-container }}
        # rcodesign reads RCODESIGN_* as configuration; use a distinct prefix.
        COMPONENT_RCODESIGN_BLOB: ${{ inputs.component-rcodesign-blob }}
        COMPONENT_RCODESIGN_SHA256: ${{ inputs.component-rcodesign-sha256 }}
        COMPONENT_PKCS11_BLOB: ${{ inputs.component-pkcs11-blob }}
        COMPONENT_PKCS11_SHA256: ${{ inputs.component-pkcs11-sha256 }}
        AZURE_CREDENTIAL_KIND: azurecli
        SIGNING_BACKEND: ${{ inputs.signing-backend }}
        PREFLIGHT_ONLY: ${{ inputs.preflight-only }}
        SIGNER_SERVICE_ENDPOINT: ${{ inputs.signer-service-endpoint }}
        SIGNER_SERVICE_PURPOSE: ${{ inputs.signer-service-purpose }}
        SIGNER_SERVICE_KEY_ID: ${{ inputs.signer-service-key-id }}
        AZURE_KEYVAULT_NAME: ${{ inputs.azure-keyvault-name }}
        AZURE_KEYVAULT_KEY_VERSION: ${{ inputs.azure-keyvault-key-version }}
        KEY_NAME: ${{ inputs.key-name }}
        CERTIFICATE_SHA256: ${{ inputs.certificate-sha256 }}
      run: uv run --locked "$ACTION_PATH/scripts/sign-release-macos.py" "$UNSIGNED_DIRECTORY" "$SIGNED_DIRECTORY"

    - name: "Install pinned notarization grpcurl"
      if: ${{ inputs.notarization-backend == 'signer-service' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/notary_signer/install_grpcurl.sh"

    - name: "Notarize signed macOS executables"
      if: ${{ inputs.preflight-only != 'true' || inputs.notarization-backend == 'signer-service' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SIGNED_DIRECTORY: ${{ inputs.signed-directory }}
        AZURE_KEYVAULT_NAME: ${{ inputs.azure-keyvault-name }}
        APPLE_NOTARIZATION_AKV_KEY_NAME: ${{ inputs.apple-notarization-akv-key-name }}
        APPLE_NOTARIZATION_BACKEND: ${{ inputs.notarization-backend }}
        PREFLIGHT_ONLY: ${{ inputs.preflight-only }}
        APPLE_NOTARIZATION_AKV_KEY_VERSION: ${{ inputs.apple-notarization-akv-key-version }}
        SIGNER_SERVICE_ENDPOINT: ${{ inputs.signer-service-endpoint }}
        NOTARIZATION_SIGNER_SERVICE_PURPOSE: ${{ inputs.notarization-signer-service-purpose }}
        NOTARIZATION_SIGNER_SERVICE_KEY_ID: ${{ inputs.notarization-signer-service-key-id }}
        NOTARIZATION_SIGNER_SERVICE_SPKI_SHA256: ${{ inputs.notarization-signer-service-spki-sha256 }}
      run: uv run --locked "$ACTION_PATH/scripts/notarize-release-macos.py" "$SIGNED_DIRECTORY"
